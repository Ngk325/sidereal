name: Deploy site to GitHub Pages

# Free, no card, no Cloudflare account. Publishes site/ — which a branch-based
# Pages source cannot do, since that only offers the repository root or /docs.
#
# One-time setup: Settings → Pages → Source → GitHub Actions.
# The site lands at https://<user>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
